<!doctype html>
<html lang="en" class="h-full">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    
    <!-- Primary Metadata -->
    <title>Arithmetica — Natural Numbers, Factor Pairs & Multiplication Tables Explorer</title>
    <meta name="title" content="Arithmetica — Natural Numbers, Factor Pairs & Multiplication Tables Explorer" />
    <meta name="description" content="Explore natural numbers, factor pairs, visual 2D array models, custom multiplication tables (1–20+), Pythagorean matrix, and prime factorizations in an interactive math explorer." />
    <meta name="keywords" content="arithmetica, natural numbers, factor pairs, multiplication tables, prime numbers, composite numbers, pythagorean table, times tables, math visualizer, square numbers, cube numbers, educational math tool" />
    <meta name="author" content="Arithmetica" />
    <meta name="robots" content="index, follow" />
    
    <!-- Canonical URL -->
    <link rel="canonical" href="https://arithmetica.netlify.app/" />
    
    <!-- Theme & Mobile App Configuration -->
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#FAF8F5" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#141412" />
    <meta name="application-name" content="Arithmetica" />
    <meta name="apple-mobile-web-app-title" content="Arithmetica" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    
    <!-- Icons & Manifest -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/favicon.svg" />
    <link rel="manifest" href="/manifest.json" />
    
    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://arithmetica.netlify.app/" />
    <meta property="og:site_name" content="Arithmetica" />
    <meta property="og:title" content="Arithmetica — Natural Numbers & Multiplication Tables Explorer" />
    <meta property="og:description" content="Interactive natural numbers explorer displaying factor pairs, custom multiplication tables, geometric array visualizers, and number theory properties." />
    <meta property="og:image" content="https://arithmetica.netlify.app/og-image.svg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Arithmetica Natural Numbers & Times Tables Explorer Banner" />
    <meta property="og:locale" content="en_US" />
    
    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:url" content="https://arithmetica.netlify.app/" />
    <meta name="twitter:title" content="Arithmetica — Natural Numbers & Multiplication Tables Explorer" />
    <meta name="twitter:description" content="Explore natural numbers, factor pairs, visual array models, Pythagorean times tables, and math properties." />
    <meta name="twitter:image" content="https://arithmetica.netlify.app/og-image.svg" />
    <meta name="twitter:image:alt" content="Arithmetica Natural Numbers & Times Tables Explorer Banner" />
    
    <!-- Structured Data (JSON-LD) for WebApplication & EducationalApplication -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "WebApplication",
      "name": "Arithmetica",
      "url": "https://arithmetica.netlify.app/",
      "description": "Interactive natural numbers grid and lookup tool that displays all factor pairs, multiplication tables, visual array models, and math properties for any number.",
      "applicationCategory": "EducationalApplication",
      "operatingSystem": "All",
      "browserRequirements": "Requires JavaScript. Requires HTML5.",
      "offers": {
        "@type": "Offer",
        "price": "0",
        "priceCurrency": "USD"
      },
      "featureList": [
        "Natural numbers exploration across configurable ranges (1 to 1000+)",
        "Factor pair decompositions and 2D block visual arrays",
        "Dedicated multiplication tables view with customizable ranges (1 to 20+)",
        "Pythagorean multiplication matrix with crosshair hover",
        "Quick mental arithmetic revision flashcard grid",
        "Interactive factor quiz game with streaks and confetti celebrations",
        "Number theory properties: prime, composite, aliquot sum, prime factorization"
      ],
      "screenshot": "https://arithmetica.netlify.app/og-image.svg",
      "author": {
        "@type": "Organization",
        "name": "Arithmetica"
      }
    }
    </script>

    <!-- Anti-FOUC script for dark mode -->
    <script>
      (function () {
        try {
          var stored = localStorage.getItem('arithmetica-theme');
          var prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
          if (stored === 'dark' || (!stored && prefersDark)) {
            document.documentElement.classList.add('dark');
          } else {
            document.documentElement.classList.remove('dark');
          }
        } catch (e) {}
      })();
    </script>

    <!-- Google Fonts Preconnect and Stylesheet -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;0,6..72,600;0,6..72,700;1,6..72,400;1,6..72,600&family=Plus+Jakarta+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@500;600;700&display=swap" rel="stylesheet">
  </head>
  <body class="h-full antialiased selection:bg-[#5A5A40] selection:text-[#FAF8F5]">
    <div id="root" class="min-h-full w-full flex flex-col"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
